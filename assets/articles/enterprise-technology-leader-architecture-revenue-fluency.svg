<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Revenue-to-Runtime Value Trace</title>
  <desc id="desc">A hand-drawn diagram connecting revenue, customer, product, platform, runtime, and evidence, with strategy flowing down and evidence flowing up.</desc>
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="14" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#061b14" flood-opacity="0.14" />
    </filter>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#087859" />
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#d87823" />
    </marker>
  </defs>
  <rect width="1600" height="1200" fill="#f7f7f2" />
  <path d="M0 0H1600V82H0Z" fill="#072d22" />
  <path d="M0 82H1600" stroke="#f59e42" stroke-width="8" />
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="96" y="174" font-size="28" font-weight="700" fill="#087859" letter-spacing="2">EXECUTIVE TECHNOLOGY LEADERSHIP</text>
    <text x="92" y="260" font-size="66" font-weight="900" fill="#0a0b0b">TRACE VALUE FROM</text>
    <text x="92" y="336" font-size="66" font-weight="900" fill="#0a0b0b">REVENUE TO RUNTIME</text>
    <text x="98" y="390" font-size="29" font-weight="700" fill="#50544f">Strategy down. Evidence up.</text>

    <g filter="url(#shadow)">
      <rect x="110" y="485" width="220" height="145" rx="18" fill="#ffffff" stroke="#087859" stroke-width="6" filter="url(#rough)" />
      <rect x="350" y="485" width="220" height="145" rx="18" fill="#e8f4ef" stroke="#0a0b0b" stroke-width="5" filter="url(#rough)" />
      <rect x="590" y="485" width="220" height="145" rx="18" fill="#ffffff" stroke="#087859" stroke-width="6" filter="url(#rough)" />
      <rect x="830" y="485" width="220" height="145" rx="18" fill="#fff1e4" stroke="#d87823" stroke-width="6" filter="url(#rough)" />
      <rect x="1070" y="485" width="220" height="145" rx="18" fill="#ffffff" stroke="#087859" stroke-width="6" filter="url(#rough)" />
    </g>

    <g text-anchor="middle">
      <text x="220" y="540" font-size="26" font-weight="900" fill="#087859">REVENUE</text>
      <text x="220" y="579" font-size="21" font-weight="700" fill="#222">Growth / retention</text>
      <text x="220" y="608" font-size="21" font-weight="700" fill="#222">Margin / risk</text>

      <text x="460" y="540" font-size="26" font-weight="900" fill="#0a0b0b">CUSTOMER</text>
      <text x="460" y="579" font-size="21" font-weight="700" fill="#222">Behavior / trust</text>
      <text x="460" y="608" font-size="21" font-weight="700" fill="#222">Time / friction</text>

      <text x="700" y="540" font-size="26" font-weight="900" fill="#087859">PRODUCT</text>
      <text x="700" y="579" font-size="21" font-weight="700" fill="#222">Capability</text>
      <text x="700" y="608" font-size="21" font-weight="700" fill="#222">Adoption / owner</text>

      <text x="940" y="540" font-size="26" font-weight="900" fill="#b65a0d">PLATFORM</text>
      <text x="940" y="579" font-size="21" font-weight="700" fill="#222">Reusable enablers</text>
      <text x="940" y="608" font-size="21" font-weight="700" fill="#222">Velocity / reuse</text>

      <text x="1180" y="540" font-size="26" font-weight="900" fill="#087859">RUNTIME</text>
      <text x="1180" y="579" font-size="21" font-weight="700" fill="#222">Security / reliability</text>
      <text x="1180" y="608" font-size="21" font-weight="700" fill="#222">Latency / unit cost</text>
    </g>

    <g stroke="#0a0b0b" stroke-width="5" fill="none" marker-end="url(#arrowGreen)" filter="url(#rough)">
      <path d="M332 558H340" />
      <path d="M572 558H580" />
      <path d="M812 558H820" />
      <path d="M1052 558H1060" />
    </g>

    <path d="M1180 675 C1180 850 330 850 220 675" fill="none" stroke="#d87823" stroke-width="8" stroke-linecap="round" stroke-dasharray="18 13" marker-end="url(#arrowOrange)" filter="url(#rough)" />
    <rect x="535" y="755" width="440" height="105" rx="22" fill="#072d22" filter="url(#shadow)" />
    <text x="755" y="800" text-anchor="middle" font-size="29" font-weight="900" fill="#ffffff">EVIDENCE LOOP</text>
    <text x="755" y="838" text-anchor="middle" font-size="21" font-weight="700" fill="#b8e3d4">Scale / repair / hold / stop</text>

    <g transform="translate(112,930)">
      <path d="M0 0H1376" stroke="#0a0b0b" stroke-width="4" stroke-linecap="round" filter="url(#rough)" />
      <text x="0" y="64" font-size="29" font-weight="900" fill="#0a0b0b">EXECUTIVE QUESTION</text>
      <text x="0" y="115" font-size="34" font-weight="800" fill="#087859">Can every architecture decision explain the value it creates?</text>
    </g>
    <text x="1490" y="1125" text-anchor="end" font-size="29" font-weight="900" fill="#0a0b0b">JWTechDev.com</text>
  </g>
</svg>
