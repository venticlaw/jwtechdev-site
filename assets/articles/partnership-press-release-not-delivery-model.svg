<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">A partnership press release is not a delivery model</title>
  <desc id="desc">A hand-drawn PARTNER Delivery Contract showing seven fields that convert an AI partnership announcement into accountable execution.</desc>
  <defs>
    <pattern id="paper" width="38" height="38" patternUnits="userSpaceOnUse">
      <rect width="38" height="38" fill="#fbfaf6"/>
      <path d="M0 37.5H38" stroke="#dfe8e3" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#112019" flood-opacity=".13"/>
    </filter>
    <style>
      .ink{fill:#101713}.green{fill:#087a57}.orange{fill:#f28c28}.muted{fill:#506159}
      .title{font:900 63px Arial,sans-serif;letter-spacing:0}.sub{font:900 31px Arial,sans-serif}
      .label{font:900 23px Arial,sans-serif}.body{font:700 19px Arial,sans-serif}.tiny{font:800 17px Arial,sans-serif}
      .rough{fill:none;stroke:#101713;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .rough2{fill:none;stroke:#087a57;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1600" height="1200" fill="url(#paper)"/>
  <rect x="34" y="34" width="1532" height="1132" rx="30" fill="none" stroke="#087a57" stroke-width="5"/>
  <path d="M48 56 Q420 25 805 52 T1548 50" fill="none" stroke="#101713" stroke-width="2" opacity=".5"/>

  <text x="90" y="105" class="tiny green">JWTECHDEV.COM / ALLIANCE DELIVERY MODEL</text>
  <text x="90" y="200" class="title ink">A PRESS RELEASE GETS ATTENTION.</text>
  <text x="90" y="276" class="title green">A DELIVERY CONTRACT GETS RESULTS.</text>
  <path d="M90 310 Q710 325 1450 307" class="rough2"/>

  <g filter="url(#soft)">
    <g transform="rotate(-.8 370 465)">
      <rect x="95" y="365" width="550" height="198" rx="24" fill="#fff" stroke="#087a57" stroke-width="6"/>
      <circle cx="153" cy="427" r="33" fill="#087a57"/>
      <text x="153" y="438" class="sub" fill="#fff" text-anchor="middle">P</text>
      <text x="210" y="421" class="label ink">PROBLEM + OUTCOME</text>
      <text x="210" y="463" class="body muted">Baseline, target, population, decision date</text>
      <path d="M210 493 Q390 483 582 495" class="rough2"/>
    </g>
    <g transform="rotate(.7 1230 465)">
      <rect x="955" y="365" width="550" height="198" rx="24" fill="#fff" stroke="#101713" stroke-width="6"/>
      <circle cx="1013" cy="427" r="33" fill="#101713"/>
      <text x="1013" y="438" class="sub" fill="#fff" text-anchor="middle">A</text>
      <text x="1070" y="421" class="label ink">ACCOUNTABLE OWNERS</text>
      <text x="1070" y="463" class="body muted">Names, authority, stop decision</text>
      <path d="M1070 493 Q1250 483 1442 495" class="rough" stroke-width="4"/>
    </g>
    <g transform="rotate(.5 370 705)">
      <rect x="95" y="605" width="550" height="198" rx="24" fill="#fff" stroke="#101713" stroke-width="6"/>
      <circle cx="153" cy="667" r="33" fill="#101713"/>
      <text x="153" y="678" class="sub" fill="#fff" text-anchor="middle">R</text>
      <text x="210" y="661" class="label ink">RESPONSIBILITY BOUNDARIES</text>
      <text x="210" y="703" class="body muted">Platform, data, risk, operations, support</text>
      <path d="M210 733 Q390 723 582 735" class="rough" stroke-width="4"/>
    </g>
    <g transform="rotate(-.6 1230 705)">
      <rect x="955" y="605" width="550" height="198" rx="24" fill="#fff" stroke="#087a57" stroke-width="6"/>
      <circle cx="1013" cy="667" r="33" fill="#087a57"/>
      <text x="1013" y="678" class="sub" fill="#fff" text-anchor="middle">T</text>
      <text x="1070" y="661" class="label ink">TECHNICAL INTEGRATION</text>
      <text x="1070" y="703" class="body muted">Identity, tools, environments, fallback</text>
      <path d="M1070 733 Q1250 723 1442 735" class="rough2"/>
    </g>
    <g transform="rotate(-.5 300 965)">
      <rect x="80" y="865" width="440" height="200" rx="24" fill="#fff" stroke="#f28c28" stroke-width="6"/>
      <text x="122" y="918" class="tiny orange">N</text>
      <text x="160" y="918" class="label ink">NUMBERS + ECONOMICS</text>
      <text x="122" y="964" class="body muted">Outcome, quality, risk, cost</text>
      <text x="122" y="1005" class="body muted">Evidence unlocks funding</text>
    </g>
    <g transform="rotate(.4 800 965)">
      <rect x="580" y="865" width="440" height="200" rx="24" fill="#101713" stroke="#087a57" stroke-width="6"/>
      <text x="622" y="918" class="tiny" fill="#9fe2c5">E</text>
      <text x="660" y="918" class="label" fill="#fff">EXECUTION CADENCE</text>
      <text x="622" y="964" class="body" fill="#dfe8e3">Decision forums + escalation</text>
      <text x="622" y="1005" class="body" fill="#dfe8e3">Meetings inspect evidence</text>
    </g>
    <g transform="rotate(-.4 1300 965)">
      <rect x="1080" y="865" width="440" height="200" rx="24" fill="#fff" stroke="#087a57" stroke-width="6"/>
      <text x="1122" y="918" class="tiny green">R</text>
      <text x="1160" y="918" class="label ink">REUSE OR RETIRE</text>
      <text x="1122" y="964" class="body muted">Scale, repair, hold, stop</text>
      <text x="1122" y="1005" class="body muted">Capture the repeatable asset</text>
    </g>
  </g>

  <path d="M645 465 Q790 415 955 465 M645 705 Q790 755 955 705 M300 865 Q390 815 500 790 M800 865 L800 810 M1300 865 Q1210 815 1100 790" class="rough2" opacity=".8"/>
  <g transform="rotate(-.4 800 588)">
    <rect x="665" y="505" width="270" height="165" rx="30" fill="#101713" stroke="#f28c28" stroke-width="7"/>
    <text x="800" y="565" class="tiny" fill="#9fe2c5" text-anchor="middle">ONE-PAGE</text>
    <text x="800" y="610" class="sub" fill="#fff" text-anchor="middle">PARTNER</text>
    <text x="800" y="644" class="tiny" fill="#dfe8e3" text-anchor="middle">DELIVERY CONTRACT</text>
  </g>

  <text x="90" y="1142" class="tiny muted">If the evidence cannot change the investment decision, it is not a delivery milestone.</text>
  <text x="1510" y="1142" class="tiny green" text-anchor="end">JWTechDev.com</text>
</svg>
