<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">AI platform ROI without theater</title>
  <desc id="desc">A hand-drawn REAL ROI ledger connecting results, evidence, adoption, loaded cost, and an executive review decision.</desc>
  <defs>
    <pattern id="paper" width="34" height="34" patternUnits="userSpaceOnUse">
      <rect width="34" height="34" fill="#fbfaf6"/>
      <path d="M0 33.5H34" stroke="#dfe8e3" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#112019" flood-opacity=".12"/>
    </filter>
    <style>
      .ink{fill:#101713}.green{fill:#087a57}.orange{fill:#f28c28}.muted{fill:#506159}
      .title{font:900 76px Arial,sans-serif;letter-spacing:0}.sub{font:700 30px Arial,sans-serif}
      .label{font:900 30px Arial,sans-serif}.body{font:700 22px Arial,sans-serif}.tiny{font:800 17px Arial,sans-serif}
      .rough{fill:none;stroke:#101713;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .rough2{fill:none;stroke:#087a57;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1600" height="1200" fill="url(#paper)"/>
  <rect x="34" y="34" width="1532" height="1132" rx="30" fill="none" stroke="#087a57" stroke-width="5"/>
  <path d="M48 56 Q410 25 790 52 T1547 50" fill="none" stroke="#101713" stroke-width="2" opacity=".5"/>

  <text x="90" y="105" class="tiny green">JWTECHDEV.COM / EXECUTIVE FIELD NOTE 32</text>
  <text x="90" y="205" class="title ink">AI PLATFORM ROI</text>
  <text x="90" y="288" class="title green">WITHOUT THEATER.</text>
  <path d="M90 315 Q720 326 1350 309" class="rough2"/>

  <g transform="rotate(-1 800 390)">
    <rect x="118" y="345" width="1364" height="106" rx="20" fill="#fff" stroke="#e9b88c" stroke-width="4"/>
    <text x="165" y="411" class="sub muted">HOURS SAVED x EXECUTIVE SALARY =</text>
    <text x="1045" y="411" class="sub orange">MAGIC VALUE</text>
    <path d="M145 373 L1435 426 M145 427 L1435 370" stroke="#d95245" stroke-width="10" stroke-linecap="round" opacity=".9"/>
  </g>

  <text x="100" y="525" class="sub ink">THE REAL ROI LEDGER</text>

  <g filter="url(#soft)">
    <g transform="rotate(-1 232 680)">
      <rect x="90" y="565" width="252" height="230" rx="18" fill="#fff" stroke="#087a57" stroke-width="6"/>
      <circle cx="142" cy="621" r="28" fill="#087a57"/>
      <text x="132" y="632" class="label" fill="#fff">R</text>
      <text x="184" y="632" class="label ink">RESULT</text>
      <path d="M118 665 Q205 653 310 667" class="rough2"/>
      <text x="118" y="710" class="body muted">Outcome + baseline</text>
      <text x="118" y="749" class="body muted">Owner + target</text>
    </g>
    <g transform="rotate(1 524 680)">
      <rect x="382" y="565" width="252" height="230" rx="18" fill="#fff" stroke="#101713" stroke-width="6"/>
      <circle cx="434" cy="621" r="28" fill="#101713"/>
      <text x="424" y="632" class="label" fill="#fff">E</text>
      <text x="476" y="632" class="label ink">EVIDENCE</text>
      <path d="M410 665 Q497 653 602 667" class="rough" stroke-width="4"/>
      <text x="410" y="710" class="body muted">Attribution path</text>
      <text x="410" y="749" class="body muted">Quality + risk</text>
    </g>
    <g transform="rotate(-.7 816 680)">
      <rect x="674" y="565" width="252" height="230" rx="18" fill="#fff" stroke="#087a57" stroke-width="6"/>
      <circle cx="726" cy="621" r="28" fill="#087a57"/>
      <text x="716" y="632" class="label" fill="#fff">A</text>
      <text x="768" y="632" class="label ink">ADOPTION</text>
      <path d="M702 665 Q789 653 894 667" class="rough2"/>
      <text x="702" y="710" class="body muted">Completed work</text>
      <text x="702" y="749" class="body muted">Overrides + exits</text>
    </g>
    <g transform="rotate(.8 1108 680)">
      <rect x="966" y="565" width="252" height="230" rx="18" fill="#fff" stroke="#101713" stroke-width="6"/>
      <circle cx="1018" cy="621" r="28" fill="#101713"/>
      <text x="1009" y="632" class="label" fill="#fff">L</text>
      <text x="1060" y="632" class="label ink">LOADED</text>
      <path d="M994 665 Q1081 653 1186 667" class="rough" stroke-width="4"/>
      <text x="994" y="710" class="body muted">Model + platform</text>
      <text x="994" y="749" class="body muted">People + controls</text>
    </g>
    <g transform="rotate(-1 1400 680)">
      <rect x="1258" y="565" width="252" height="230" rx="18" fill="#fff" stroke="#f28c28" stroke-width="6"/>
      <circle cx="1310" cy="621" r="28" fill="#f28c28"/>
      <text x="1300" y="632" class="label" fill="#fff">R</text>
      <text x="1352" y="632" class="label ink">REVIEW</text>
      <path d="M1286 665 Q1373 653 1478 667" fill="none" stroke="#f28c28" stroke-width="5" stroke-linecap="round"/>
      <text x="1286" y="710" class="body muted">Scale / repair</text>
      <text x="1286" y="749" class="body muted">Hold / stop</text>
    </g>
  </g>

  <path d="M145 835 Q790 890 1455 835" class="rough2"/>
  <path d="M1455 835 l-34 -20 m34 20 l-31 26" class="rough2"/>

  <g transform="rotate(.4 800 984)">
    <rect x="205" y="900" width="1190" height="175" rx="26" fill="#101713"/>
    <text x="800" y="964" class="sub" fill="#fff" text-anchor="middle">A METRIC EARNS ITS PLACE WHEN IT CHANGES A DECISION.</text>
    <text x="800" y="1020" class="body" fill="#9fe2c5" text-anchor="middle">BASELINE -&gt; USAGE -&gt; OUTCOME -&gt; ALL-IN COST -&gt; NEXT MOVE</text>
  </g>

  <text x="90" y="1130" class="tiny muted">Measure the workload. Measure the platform. Never confuse activity with value.</text>
  <text x="1510" y="1130" class="tiny green" text-anchor="end">JWTechDev.com</text>
</svg>
