<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Human in the Loop Business Card Family</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #e9eeec; color: #0d0f12; font-family: Arial, sans-serif; }
    main { width: min(1240px, calc(100% - 32px)); margin: 48px auto 80px; }
    .eyebrow { color: #087a59; font-size: 13px; font-weight: 800; letter-spacing: 2px; }
    h1 { max-width: 960px; margin: 14px 0 16px; font-size: clamp(38px, 7vw, 78px); line-height: .95; }
    p { max-width: 850px; margin: 0 0 36px; color: #555b62; font-size: 19px; line-height: 1.5; }
    img { display: block; width: 100%; height: auto; border: 1px solid #d9dfdc; border-radius: 6px; background: #fff; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">AFROTECH / HUMAN IN THE LOOP</div>
    <h1>The selected design and its spin-offs</h1>
    <p>The original bottom-right concept remains intact as Option 1. Three additional directions explore strategy, executive systems leadership, and human-centered production controls.</p>
    <img src="human-in-the-loop-card-family.png" alt="Human in the Loop business card family for Joshua TechDev Walker">
  </main>
</body>
</html>
