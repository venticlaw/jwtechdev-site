      <text x="70" y="32" font-size="32" font-weight="900" fill="#111827">Maps to the official AWS exam guide</text>
    </g>
    <g transform="translate(60 140)">
      <rect x="0" y="0" width="42" height="42" rx="9" fill="#0b6e4f"/>
      <path d="M10 23l9 10 18-22" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="32" font-size="32" font-weight="900" fill="#111827">Includes labs, not just screenshots</text>
    </g>
    <g transform="translate(60 218)">
      <rect x="0" y="0" width="42" height="42" rx="9" fill="#0b6e4f"/>
      <path d="M10 23l9 10 18-22" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="32" font-size="32" font-weight="900" fill="#111827">Explains why wrong answers are wrong</text>
    </g>
