<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">The PROOF operating model for enterprise AI</title>
  <desc id="desc">A hand-drawn diagram connecting an AI prototype to a production organization through purpose, roles, operating boundaries, observability, and feedback.</desc>
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="29" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="paper" width="34" height="34" patternUnits="userSpaceOnUse">
      <rect width="34" height="34" fill="#f7f6f1"/>
      <path d="M0 33.5H34" stroke="#d7e6df" stroke-width="1" opacity=".55"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1l10 5-10 5" fill="none" stroke="#0b1713" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1600" height="1200" fill="url(#paper)"/>
  <rect x="48" y="46" width="1504" height="1108" rx="24" fill="none" stroke="#0e7a58" stroke-width="5" filter="url(#rough)"/>
  <text x="92" y="108" font-family="Roboto Condensed, Arial, sans-serif" font-size="28" font-weight="700" fill="#0e7a58" letter-spacing="2">JWTECHDEV.COM  /  FIELD NOTE 29</text>
  <text x="92" y="205" font-family="Roboto Condensed, Arial, sans-serif" font-size="69" font-weight="900" fill="#0b0c0e">THE PROTOTYPE WORKS.</text>
  <text x="92" y="282" font-family="Roboto Condensed, Arial, sans-serif" font-size="69" font-weight="900" fill="#0e7a58">NOW THE ORGANIZATION HAS TO.</text>
  <path d="M95 305c230 12 476-12 720 3 198 11 382-8 609 1" fill="none" stroke="#ee8b2d" stroke-width="10" stroke-linecap="round" filter="url(#rough)"/>

  <g transform="translate(80 390)" filter="url(#rough)">
    <rect width="250" height="450" rx="22" fill="#ffffff" stroke="#0b1713" stroke-width="5"/>
    <path d="M38 93c28-44 105-54 146-12 52 54 16 143-59 143-68 0-111-73-74-131z" fill="#e8f4ee" stroke="#0e7a58" stroke-width="5"/>
    <path d="M88 161c7-43 30-72 71-95M74 132c50 0 88 17 116 51" fill="none" stroke="#ee8b2d" stroke-width="6" stroke-linecap="round"/>
    <text x="34" y="290" font-family="Roboto Condensed, Arial, sans-serif" font-size="38" font-weight="900" fill="#0b0c0e">AI PROTOTYPE</text>
    <text x="34" y="345" font-family="Roboto Condensed, Arial, sans-serif" font-size="25" font-weight="700" fill="#52575c">clean data</text>
    <text x="34" y="382" font-family="Roboto Condensed, Arial, sans-serif" font-size="25" font-weight="700" fill="#52575c">happy path</text>
    <text x="34" y="419" font-family="Roboto Condensed, Arial, sans-serif" font-size="25" font-weight="700" fill="#52575c">expert nearby</text>
  </g>

  <path d="M350 610c42-31 77-31 120 2" fill="none" stroke="#0b1713" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)" filter="url(#rough)"/>

  <g transform="translate(490 360)">
    <text x="0" y="0" font-family="Roboto Condensed, Arial, sans-serif" font-size="31" font-weight="900" fill="#0e7a58">THE PROOF OPERATING MODEL</text>
    <g font-family="Roboto Condensed, Arial, sans-serif">
      <g transform="translate(0 55)" filter="url(#rough)">
        <rect width="640" height="96" rx="18" fill="#0e7a58"/>
        <circle cx="52" cy="48" r="31" fill="#f7f6f1"/>
        <text x="42" y="59" font-size="34" font-weight="900" fill="#0e7a58">P</text>
        <text x="105" y="42" font-size="30" font-weight="900" fill="#ffffff">PURPOSE</text>
        <text x="105" y="72" font-size="21" font-weight="600" fill="#e8f4ee">workflow + user + measurable outcome</text>
      </g>
      <g transform="translate(18 170)" filter="url(#rough)">
        <rect width="640" height="96" rx="18" fill="#ffffff" stroke="#0b1713" stroke-width="4"/>
        <circle cx="52" cy="48" r="31" fill="#ee8b2d"/>
        <text x="41" y="59" font-size="34" font-weight="900" fill="#0b0c0e">R</text>
        <text x="105" y="42" font-size="30" font-weight="900" fill="#0b0c0e">ROLES</text>
        <text x="105" y="72" font-size="21" font-weight="600" fill="#52575c">business + technical + risk + operations</text>
      </g>
      <g transform="translate(-6 285)" filter="url(#rough)">
        <rect width="640" height="96" rx="18" fill="#ffffff" stroke="#0b1713" stroke-width="4"/>
        <circle cx="52" cy="48" r="31" fill="#e8f4ee" stroke="#0e7a58" stroke-width="3"/>
        <text x="40" y="59" font-size="34" font-weight="900" fill="#0e7a58">O</text>
        <text x="105" y="42" font-size="30" font-weight="900" fill="#0b0c0e">OPERATING BOUNDARIES</text>
        <text x="105" y="72" font-size="21" font-weight="600" fill="#52575c">data + tools + approvals + budget + fallback</text>
      </g>
      <g transform="translate(15 400)" filter="url(#rough)">
        <rect width="640" height="96" rx="18" fill="#ffffff" stroke="#0b1713" stroke-width="4"/>
        <circle cx="52" cy="48" r="31" fill="#e8f4ee" stroke="#0e7a58" stroke-width="3"/>
        <text x="40" y="59" font-size="34" font-weight="900" fill="#0e7a58">O</text>
        <text x="105" y="42" font-size="30" font-weight="900" fill="#0b0c0e">OBSERVABILITY</text>
        <text x="105" y="72" font-size="21" font-weight="600" fill="#52575c">quality + adoption + cost + incidents + outcome</text>
      </g>
      <g transform="translate(0 515)" filter="url(#rough)">
        <rect width="640" height="96" rx="18" fill="#ee8b2d"/>
        <circle cx="52" cy="48" r="31" fill="#0b0c0e"/>
        <text x="43" y="59" font-size="34" font-weight="900" fill="#ffffff">F</text>
        <text x="105" y="42" font-size="30" font-weight="900" fill="#0b0c0e">FEEDBACK</text>
        <text x="105" y="72" font-size="21" font-weight="700" fill="#2e241b">users + domain experts + release cadence</text>
      </g>
    </g>
  </g>

  <path d="M1165 610c39-30 76-29 116 3" fill="none" stroke="#0b1713" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)" filter="url(#rough)"/>

  <g transform="translate(1270 390)" filter="url(#rough)">
    <rect width="250" height="450" rx="22" fill="#0b1713" stroke="#0e7a58" stroke-width="6"/>
    <path d="M42 107l74-57 73 57v88H42z" fill="#e8f4ee" stroke="#ffffff" stroke-width="5"/>
    <path d="M65 195v-55h102v55M90 140v-36h52v36" fill="none" stroke="#0e7a58" stroke-width="7"/>
    <circle cx="183" cy="76" r="27" fill="#ee8b2d"/>
    <path d="M169 76l10 10 18-22" fill="none" stroke="#0b0c0e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="285" font-family="Roboto Condensed, Arial, sans-serif" font-size="29" font-weight="900" fill="#ffffff">PRODUCTION</text>
    <text x="28" y="324" font-family="Roboto Condensed, Arial, sans-serif" font-size="29" font-weight="900" fill="#ffffff">CAPABILITY</text>
    <text x="28" y="374" font-family="Roboto Condensed, Arial, sans-serif" font-size="22" font-weight="700" fill="#9ad4bd">owned</text>
    <text x="28" y="407" font-family="Roboto Condensed, Arial, sans-serif" font-size="22" font-weight="700" fill="#9ad4bd">governed</text>
    <text x="28" y="440" font-family="Roboto Condensed, Arial, sans-serif" font-size="22" font-weight="700" fill="#9ad4bd">measurable</text>
  </g>

  <path d="M477 1011c210 40 465 43 701 0" fill="none" stroke="#0e7a58" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)" filter="url(#rough)"/>
  <text x="558" y="1083" font-family="Roboto Condensed, Arial, sans-serif" font-size="33" font-weight="900" fill="#0b0c0e">A MODEL CAN PROVE THE TASK.</text>
  <text x="558" y="1123" font-family="Roboto Condensed, Arial, sans-serif" font-size="33" font-weight="900" fill="#0e7a58">THE ORGANIZATION HAS TO OWN THE OUTCOME.</text>
</svg>
