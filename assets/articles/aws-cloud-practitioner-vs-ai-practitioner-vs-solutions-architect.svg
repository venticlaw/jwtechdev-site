<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">AWS certification comparison for beginners</title>
  <desc id="desc">A JWTechDev.com hand-drawn style comparison of Cloud Practitioner, AI Practitioner, and Solutions Architect Associate.</desc>
  <rect width="1400" height="860" fill="#f7f3ea"/>
  <path d="M76 98c238-18 470-20 701-9 190 9 367 7 548-5" fill="none" stroke="#0b6e4f" stroke-width="7" stroke-linecap="round"/>
  <text x="102" y="82" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">JWTechDev.com</text>
  <text x="102" y="168" font-family="Arial, sans-serif" font-size="64" font-weight="900" fill="#111827">Which AWS cert fits first?</text>
  <text x="104" y="225" font-family="Arial, sans-serif" font-size="30" fill="#4b5563">Vocabulary -> AI context -> architecture proof</text>
  <g transform="translate(100 300)">
    <rect x="0" y="0" width="350" height="330" rx="26" fill="#ffffff" stroke="#111827" stroke-width="5"/>
    <text x="35" y="64" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#0b6e4f">Cloud Practitioner</text>
    <path d="M38 88c70-7 153-6 262 2" stroke="#fa9f42" stroke-width="6" stroke-linecap="round"/>
    <text x="35" y="143" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#111827">Best when:</text>
    <text x="35" y="190" font-family="Arial, sans-serif" font-size="24" fill="#374151">You need cloud language,</text>
    <text x="35" y="228" font-family="Arial, sans-serif" font-size="24" fill="#374151">billing basics, shared</text>
    <text x="35" y="266" font-family="Arial, sans-serif" font-size="24" fill="#374151">responsibility, and confidence.</text>
  </g>
  <g transform="translate(525 300)">
    <rect x="0" y="0" width="350" height="330" rx="26" fill="#ffffff" stroke="#111827" stroke-width="5"/>
    <text x="35" y="64" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#721817">AI Practitioner</text>
    <path d="M38 88c77-8 154-8 246 0" stroke="#0b6e4f" stroke-width="6" stroke-linecap="round"/>
    <text x="35" y="143" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#111827">Best when:</text>
    <text x="35" y="190" font-family="Arial, sans-serif" font-size="24" fill="#374151">You need AI vocabulary,</text>
    <text x="35" y="228" font-family="Arial, sans-serif" font-size="24" fill="#374151">responsible AI context,</text>
    <text x="35" y="266" font-family="Arial, sans-serif" font-size="24" fill="#374151">and service awareness.</text>
  </g>
  <g transform="translate(950 300)">
    <rect x="0" y="0" width="350" height="330" rx="26" fill="#ffffff" stroke="#111827" stroke-width="5"/>
    <text x="35" y="64" font-family="Arial, sans-serif" font-size="31" font-weight="900" fill="#0f2f4a">Solutions Architect</text>
    <path d="M38 88c89-6 173-6 267 2" stroke="#721817" stroke-width="6" stroke-linecap="round"/>
    <text x="35" y="143" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#111827">Best when:</text>
    <text x="35" y="190" font-family="Arial, sans-serif" font-size="24" fill="#374151">You can reason about</text>
    <text x="35" y="228" font-family="Arial, sans-serif" font-size="24" fill="#374151">secure, resilient, cost-aware</text>
    <text x="35" y="266" font-family="Arial, sans-serif" font-size="24" fill="#374151">systems and tradeoffs.</text>
  </g>
  <path d="M454 463c20-5 40-5 61 0" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
  <path d="M505 444l28 19-28 20" fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M879 463c20-5 40-5 61 0" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
  <path d="M930 444l28 19-28 20" fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="104" y="735" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#111827">Rule: pick the cert that supports your next useful proof project.</text>
  <text x="104" y="786" font-family="Arial, sans-serif" font-size="24" fill="#4b5563">Updated 2026-09-12 · JWTechDev.com</text>
</svg>
