<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dark Systems Business Card Family</title>
  <style>
    @font-face { font-family: "Roboto"; src: url("../fonts/Roboto-Regular.ttf") format("truetype"); font-weight: 400; }
    @font-face { font-family: "Roboto"; src: url("../fonts/Roboto-Bold.ttf") format("truetype"); font-weight: 700; }
    @font-face { font-family: "Roboto Condensed"; src: url("../fonts/Roboto_Condensed-Black.ttf") format("truetype"); font-weight: 900; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #e9eeec; color: #0e0e11; font-family: "Roboto", Arial, sans-serif; }
    main { width: min(1240px, calc(100% - 32px)); margin: 48px auto 80px; }
    .eyebrow { color: #0b6e4f; font-size: 13px; font-weight: 700; letter-spacing: 2px; }
    h1 { max-width: 980px; margin: 14px 0 16px; font-family: "Roboto Condensed", "Roboto", Arial, sans-serif; font-size: clamp(38px, 7vw, 78px); font-weight: 900; line-height: .95; }
    p { max-width: 850px; margin: 0 0 36px; color: #4a4a51; font-size: 19px; line-height: 1.5; }
    img { display: block; width: 100%; height: auto; border: 1px solid #c7c7cb; border-radius: 6px; background: #fff; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">AFROTECH / DARK SYSTEMS</div>
    <h1>Four sharper versions of the black card</h1>
    <p>Each direction preserves the dark systems aesthetic while increasing print readability, simplifying the hierarchy, centering the portrait, and keeping the JWTechDev brand fonts intact.</p>
    <img src="dark-card-family.png" alt="Four dark systems business card directions for Joshua TechDev Walker">
  </main>
</body>
</html>
