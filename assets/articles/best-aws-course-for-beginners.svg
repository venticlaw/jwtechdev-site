<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">AWS beginner course checklist</title>
  <desc id="desc">A JWTechDev.com hand-drawn style checklist for evaluating AWS beginner courses.</desc>
